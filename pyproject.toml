[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dossier"
version = "0.1.0"
description = "Local-first document dossier explorer"
# SPDX expression (PEP 639), matching the MIT text in LICENSE. Same mismatch
# class as panopto-course-assistant: the licence existed only as a file.
license = "MIT"
requires-python = ">=3.13"
# Every runtime dependency here is permissive (MIT / BSD / Apache / PSF), so the MIT
# licence in LICENSE covers a default install. PDF text, geometry and rasterising run
# on PDFium through `pypdfium2` (BSD-3-Clause / Apache-2.0). PyMuPDF is NOT a runtime
# dependency: it is AGPL-3.0-or-commercial, and it lives in the `pymupdf` extra below
# for anyone who wants the alternative engine or runs the fixture-generating tests.
dependencies = ["fastapi", "uvicorn[standard]", "watchfiles", "python-docx", "pypdfium2", "pypdf", "pillow", "docx2pdf", "jinja2", "defusedxml", "httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# Windows DOCX rendering drives a private Word instance through COM.
windows = ["pywin32"]
# AGPL-3.0-or-commercial (Artifex). Optional on purpose: importing it makes the
# combined work AGPL if you ever distribute a bundled application. The default
# install does not need it; see THIRD-PARTY.md.
pymupdf = ["pymupdf"]
# Authenticated capture: Playwright drives a real Chromium profile so the user can
# sign in themselves and the session (cookies + localStorage) can be reused. The
# public, no-session path does not need this extra; it uses the obscura binary when
# one is installed, and plain httpx for the JSON feeds.
browser = ["playwright>=1.49"]
# HTML -> text extraction for captured pages. lxml is already pulled in by
# python-docx, so this costs no new download; it is named here because the scrape
# path imports it directly.
scrape = ["lxml>=5", "cssselect>=1.2"]

[project.scripts]
dossier = "dossier.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --basetemp=C:/dossier-pytest-temp"

# NOTE: a `[dependency-groups] dev = ["httpx2>=2.12.0"]` block used to live here.
# `httpx2` was imported nowhere in `src/` or `tests/`, and both it and `httpx`
# install a top-level `httpx` module into `.venv`, so which one `import httpx`
# resolved to depended on install order. `dossier.model` imports `httpx`, so the
# duplicate was removed and `httpx>=0.28` declared as a real runtime dependency
# above.
#
# RESOLVED 2026-10-11: an earlier line here claimed ".venv and uv.lock still
# contain httpx2 until someone runs uv lock / uv sync". That was VERIFIED FALSE
# and is removed. `uv lock` + `uv sync` were run; `.venv` now holds only
# httpx 0.28.1 + httpcore 1.0.9, find_spec("httpx2") is None, and the
# working-tree uv.lock has zero httpx2 rows. The prune needed the Windows
# read-only *.dist-info\licenses trap cleared first -- see
# ~/.dsh/memory/standing-rules.md.
