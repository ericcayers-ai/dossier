[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dossier"
version = "0.1.0"
description = "Local-first document dossier explorer"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn[standard]", "watchfiles", "python-docx", "pymupdf", "pypdf", "pillow", "docx2pdf", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
dossier = "dossier.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --basetemp=C:/dossier-pytest-temp"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
